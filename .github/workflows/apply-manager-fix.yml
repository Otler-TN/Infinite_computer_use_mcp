name: Apply remote-link startup fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply fix
        shell: pwsh
        run: |
          @'
          
          '@ | Set-Content -LiteralPath fix.b64 -Encoding ascii
          py -c "import base64,gzip,pathlib; pathlib.Path('fix.patch').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('fix.b64').read_text())))"
          git apply --check fix.patch
          git apply fix.patch

      - name: Install locked runtime
        shell: powershell
        run: ./scripts/setup.ps1

      - name: Lint
        run: ./.venv/Scripts/python.exe -m ruff check scripts tests launcher.pyw

      - name: Test
        run: ./.venv/Scripts/python.exe -m pytest -q

      - name: Build release
        run: ./.venv/Scripts/python.exe ./scripts/build-release.py

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/common.ps1 scripts/manager_backend.py scripts/mcp_manager.py scripts/setup_window.py scripts/start-demo.ps1 tests/test_manager.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Fix remote link startup and recovery"
            git push origin HEAD:main
          }
