        run: ./.venv/Scripts/python.exe -m pytest -q

      - name: Build release
        run: ./.venv/Scripts/python.exe ./scripts/build-release.py

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/common.ps1 scripts/manager_backend.py scripts/mcp_manager.py scripts/setup_window.py scripts/start-demo.ps1 tests/test_manager.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Fix remote link startup and recovery"
            git push origin HEAD:main
          }
