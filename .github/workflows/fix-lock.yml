name: Refresh uv lock

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned uv
        shell: pwsh
        run: py -m pip install uv==0.12.13
      - name: Rebuild complete lock file
        shell: pwsh
        run: |
          Remove-Item uv.lock -Force
          py -m uv lock
      - name: Commit refreshed lock
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Refresh uv lock metadata"
            git push origin HEAD:main
          }
