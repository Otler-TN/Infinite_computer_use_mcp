[project]
name = "infinite-computer-use-mcp"
version = "0.1.0"
description = "Complete Windows-MCP launcher with durable command jobs and binary file transfer"
requires-python = ">=3.13,<3.15"
dependencies = [
    "windows-mcp==0.8.5",
    "psutil>=7.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
